name: Release

run-name: Release (${{ inputs.version-bump-type }})

on:
  workflow_dispatch:
    inputs:
      version-bump-type:
        description: Version bump type
        required: false
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    # write: creating the release creates the vX.Y.Z tag, and the vN major tag is force-pushed
    permissions:
      contents: write
    steps:
      # Consumers pin to the moving vN tag, so releasing from a branch would ship unmerged code.
      - name: check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be made from main, not ${{ github.ref_name }}"
          exit 1

      - name: checkout
        uses: actions/checkout@v4

      # Dogfood: the version comes from this repo's own action. The floating vN tags are
      # ignored by it since only exact vX.Y.Z tags count.
      - name: bump version
        id: version
        uses: ./
        with:
          bump-type: ${{ inputs.version-bump-type }}

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: move major tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAJOR_TAG="v${VERSION%%.*}"
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR_TAG"
          echo "Moved $MAJOR_TAG to $GITHUB_SHA"
